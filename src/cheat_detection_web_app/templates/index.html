<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheat Detection Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Cheat Detection Dashboard</h1>

  <div id="source-controls">
    <h2>Select Source</h2>
    <div class="source-options">
      <button id="webcam-btn" class="source-btn active">Use Webcam</button>
      <label for="file-upload" class="source-btn">Upload File</label>
      <input type="file" id="file-upload" accept="video/mp4, image/jpeg, image/png" style="display: none;">
    </div>
    <div id="file-info" style="display: none;">
      <span id="file-name"></span>
      <button id="reset-btn">Reset</button>
    </div>
  </div>

  <div id="pose-controls">
    <h2>Pose Controls</h2>
    <div class="pose-options">
      <button id="toggle-pose-btn" class="pose-btn">Hide Pose</button>
    </div>
  </div>

  <div id="scoring-controls" style="margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <h2>Scoring Thresholds</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <div>
        <label>Head Yaw Threshold: <span id="yaw-value">30</span>°</label>
        <input type="range" id="yaw-threshold" min="15" max="60" value="30" step="5" style="width: 100%;">
      </div>
      <div>
        <label>Head Pitch Threshold: <span id="pitch-value">20</span>°</label>
        <input type="range" id="pitch-threshold" min="10" max="40" value="20" step="5" style="width: 100%;">
      </div>
      <div>
        <label>Suspicion Threshold: <span id="suspicion-value">20</span></label>
        <input type="range" id="suspicion-threshold" min="20" max="100" value="20" step="10" style="width: 100%;">
      </div>
    </div>
  </div>

  <div id="container">
    <div id="video-container">
      <!-- Display pre-annotated frame from backend (includes IDs + seat zones) -->
      <img id="annotated-feed" src="" alt="Annotated Video Feed" style="width:100%; display:none;">
      <canvas id="displayCanvas" width="640" height="480"></canvas>
    </div>
    <div id="metrics-container">
      <h2>Detection Metrics</h2>
      <div id="metrics-content">
        <!-- Metrics will be updated here -->
      </div>
      <div id="seat-map-info" style="margin-top: 15px; padding: 10px; background: #f0f8ff; border-radius: 4px;">
        <h3>Seat Assignments</h3>
        <div id="seat-assignments">No seat data</div>
      </div>
      <div id="behavior-info" style="margin-top: 15px; padding: 10px; background: #fff3cd; border-radius: 4px;">
        <h3>Behavior Analysis</h3>
        <div id="behavior-content">No behavior data</div>
      </div>
      <div id="scoring-info" style="margin-top: 15px; padding: 10px; background: #ffebee; border-radius: 4px;">
        <h3>Suspicion Scores</h3>
        <div id="scoring-content">No scores available</div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
